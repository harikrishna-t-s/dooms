<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>
  (() => { try { const s = localStorage.getItem('theme'); if (s) document.documentElement.setAttribute('data-theme', s); } catch (_) {} })();
</script>
<title>Doomsday Watch · Chalakudy</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236d28d9' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 1 0 0-8c-2 0-4 1.33-6 4Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#fff; --header:rgba(250,250,250,.94); --surface:#fff; --surface-h:#f5f5f5;
  --hover-ol:rgba(0,0,0,.04); --active-ol:rgba(0,0,0,.07);
  --border:rgba(0,0,0,.1); --border-soft:rgba(0,0,0,.06);
  --text:#0a0a0a; --muted:#6b6b6b; --dim:rgba(0,0,0,.35);
  --accent:#6d28d9; --accent-h:#7c3aed; --accent-soft:rgba(109,40,217,.1);
  --ok:#15803d; --ok-soft:rgba(21,128,61,.12); --warn:#b45309;
  --cdot-l:42%; --stripe-l:46%; --cat-l:36%;
  --radius-sm:4px; --radius-md:6px; --radius-lg:8px;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --t:background-color 140ms ease,border-color 140ms ease,color 140ms ease,opacity 140ms ease;
  --font:"Inter",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
[data-theme="dark"] {
  --bg:#191919; --header:rgba(26,26,26,.94); --surface:#222; --surface-h:#2a2a2a;
  --hover-ol:rgba(255,255,255,.05); --active-ol:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.12); --border-soft:rgba(255,255,255,.07);
  --text:#f0f0f0; --muted:#a0a0a0; --dim:rgba(255,255,255,.4);
  --accent:#a78bfa; --accent-h:#c4b5fd; --accent-soft:rgba(167,139,250,.15);
  --ok:#4ade80; --ok-soft:rgba(74,222,128,.14); --warn:#fbbf24;
  --cdot-l:62%; --stripe-l:58%; --cat-l:68%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#191919; --header:rgba(26,26,26,.94); --surface:#222; --surface-h:#2a2a2a;
    --hover-ol:rgba(255,255,255,.05); --active-ol:rgba(255,255,255,.09);
    --border:rgba(255,255,255,.12); --border-soft:rgba(255,255,255,.07);
    --text:#f0f0f0; --muted:#a0a0a0; --dim:rgba(255,255,255,.4);
    --accent:#a78bfa; --accent-h:#c4b5fd; --accent-soft:rgba(167,139,250,.15);
    --ok:#4ade80; --ok-soft:rgba(74,222,128,.14); --warn:#fbbf24;
    --cdot-l:62%; --stripe-l:58%; --cat-l:68%;
  }
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-text-size-adjust:100%; background:var(--bg); color:var(--text); font-family:var(--font); font-size:15px; line-height:1.55; letter-spacing:-.01em; -webkit-font-smoothing:antialiased; scroll-behavior:smooth; }
body { background:var(--bg); color:var(--text); min-height:100dvh; padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }
button,select { font:inherit; color:inherit; cursor:pointer; background:none; border:none; touch-action:manipulation; }
a { color:var(--accent); text-decoration:none; } a:hover { color:var(--accent-h); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--radius-sm); }
strong { font-weight:600; }
@keyframes slideFade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
@keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.04); } }

/* header */
.app-header { position:sticky; top:0; z-index:10; background:var(--header); border-bottom:1px solid var(--border); padding-top:env(safe-area-inset-top); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
.header-inner,main { max-width:760px; margin:0 auto; }
.header-inner { padding:14px 24px 10px; }
.top-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
.app-title { display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:500; user-select:none; }
.app-title svg { width:16px; height:16px; color:var(--accent); }
.tools { display:flex; gap:6px; align-items:center; }
.icon-btn,.btn { height:30px; border-radius:var(--radius-md); border:1px solid var(--border-soft); color:var(--muted); display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 10px; font-size:13px; font-weight:500; transition:var(--t),transform 160ms var(--ease-spring); }
.icon-btn { width:30px; padding:0; }
.icon-btn:hover,.btn:hover { color:var(--text); background:var(--hover-ol); border-color:var(--border); }
.icon-btn:active,.btn:active { transform:scale(.95); }
.btn.primary { background:var(--accent); color:#fff; border-color:transparent; }
.btn.primary:hover { background:var(--accent-h); color:#fff; }
.icon-btn svg { width:15px; height:15px; }
.sun { display:none; } [data-theme="dark"] .sun { display:block; } [data-theme="dark"] .moon { display:none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sun { display:block; } :root:not([data-theme="light"]) .moon { display:none; } }
.filter-bar { display:flex; gap:3px; overflow-x:auto; scrollbar-width:none; }
.filter-bar::-webkit-scrollbar { display:none; }
.chip { flex:none; height:27px; padding:0 10px; border-radius:var(--radius-sm); border:1px solid transparent; color:var(--muted); font-size:13px; font-weight:500; display:flex; align-items:center; gap:6px; white-space:nowrap; transition:var(--t),transform 160ms var(--ease-spring); }
.chip:hover { color:var(--text); background:var(--hover-ol); transform:translateY(-1px); }
.chip[aria-pressed="true"] { color:var(--accent); background:var(--active-ol); border-color:var(--border); }
.cdot { width:7px; height:7px; border-radius:50%; flex-shrink:0; background:hsl(var(--ch) 65% var(--cdot-l)); }

main { padding:20px 24px calc(env(safe-area-inset-bottom) + 64px); }
.status-bar { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:11px; color:var(--dim); font-weight:500; letter-spacing:.06em; text-transform:uppercase; margin-bottom:18px; }
.sec-title { font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); padding-bottom:8px; border-bottom:1px solid var(--border-soft); margin:0 0 8px; display:flex; align-items:center; gap:8px; }
.sec-title .n { font-weight:400; color:var(--dim); }
.divider { height:1px; background:var(--border); margin:34px 0 26px; }
.group-header { display:flex; align-items:center; gap:8px; margin:26px 0 6px; padding-bottom:8px; border-bottom:1px solid var(--border-soft); }
.group-title { font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.group-count { font-size:11px; color:var(--dim); }

/* cards */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); margin-bottom:4px; overflow:hidden; animation:slideFade 240ms var(--ease-out) both; transition:transform 180ms var(--ease-out),box-shadow 180ms var(--ease-out); }
.card:hover { box-shadow:0 4px 12px rgba(0,0,0,.06); transform:translateY(-1px); }
[data-theme="dark"] .card:hover { box-shadow:0 4px 14px rgba(0,0,0,.45); }
.card-head { display:flex; width:100%; min-height:52px; text-align:left; user-select:none; }
.card-stripe { width:3px; flex-shrink:0; background:hsl(var(--ch) 65% var(--stripe-l)); opacity:.45; transition:opacity 180ms,width 180ms var(--ease-out); }
.card:hover .card-stripe { opacity:.85; width:4px; } .card.open .card-stripe { opacity:1; width:4px; }
.card-head-inner { display:flex; align-items:center; flex:1; gap:10px; padding:12px 14px 12px 12px; min-width:0; }
.card-head:hover .card-head-inner { background:var(--hover-ol); }
.card-text { flex:1; min-width:0; }
.card-category { display:block; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:hsl(var(--ch) 65% var(--cat-l)); }
.card-name { display:block; font-size:15px; font-weight:600; line-height:1.4; overflow-wrap:anywhere; }
.card-summary { display:block; margin-top:2px; font-size:13.5px; color:var(--muted); }
.chevron { width:18px; height:18px; display:flex; align-items:center; justify-content:center; color:var(--dim); transition:transform 260ms var(--ease-spring),color 160ms; }
.chevron svg { width:12px; height:12px; }
.open .chevron { transform:rotate(180deg); color:var(--accent); }
.card-body { display:grid; grid-template-rows:0fr; opacity:0; border-top:1px solid transparent; margin-left:4px; transition:grid-template-rows 240ms var(--ease-out),opacity 200ms,border-color 200ms; }
.card.open .card-body { grid-template-rows:1fr; opacity:1; border-top-color:var(--border-soft); }
.card-body-inner { overflow:hidden; min-height:0; padding:0 16px 0 12px; }
.card.open .card-body-inner { padding:4px 16px 14px 12px; }
.field-row { display:grid; grid-template-columns:104px 1fr; gap:4px 12px; padding:9px 4px; border-bottom:1px solid var(--border-soft); align-items:start; }
.field-row:last-child { border-bottom:none; }
.field-key { font-size:12px; font-weight:500; color:var(--dim); padding-top:5px; }
.field-val { min-width:0; }
.note { font-size:13.5px; color:var(--muted); padding:8px 4px; }

/* shows */
.show { display:inline-flex; flex-direction:column; gap:6px; vertical-align:top; margin:0 6px 6px 0; padding:8px 10px; border:1px solid var(--border-soft); border-radius:var(--radius-md); background:var(--surface-h); min-width:170px; max-width:100%; }
.show-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-variant-numeric:tabular-nums; }
.show-time { font-weight:600; font-size:14px; }
.show-screen { font-size:11px; color:var(--muted); letter-spacing:.03em; text-transform:uppercase; }
.show-actions { display:flex; gap:6px; align-items:center; font-size:12.5px; }
.link-btn { color:var(--accent); font-weight:500; font-size:12.5px; padding:0; }
.link-btn:hover { color:var(--accent-h); }
.res { font-size:12.5px; color:var(--muted); }
.res b { color:var(--text); font-weight:600; }
.seatmap { display:flex; flex-direction:column; gap:2px; margin-top:6px; overflow-x:auto; padding-bottom:4px; }
.srow { display:flex; gap:2px; }
.seat { width:8px; height:8px; border-radius:2px; flex:none; background:var(--accent); opacity:.55; }
.seat.x { background:var(--border); opacity:1; }
.seat.b { background:var(--ok); opacity:1; outline:1.5px solid var(--ok); outline-offset:1px; }
.srow i { width:8px; flex:none; }

/* doomsday hero */
.hero { border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--surface); padding:16px 16px 12px; margin-bottom:6px; animation:slideFade 240ms var(--ease-out) both; --ch:265; }
.hero.live { border-color:var(--ok); box-shadow:0 0 0 3px var(--ok-soft); }
.hero-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
.hero h2 { font-size:19px; font-weight:600; letter-spacing:-.02em; }
.hero .sub { font-size:13.5px; color:var(--muted); margin-top:2px; }
.badge { display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 10px; border-radius:99px; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; background:var(--active-ol); color:var(--muted); }
.badge::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.badge.ok { background:var(--ok-soft); color:var(--ok); animation:pulse 2s ease-in-out infinite; }
.badge.err { color:var(--warn); }
.hero-rows { margin-top:10px; }

.state-empty,.state-error { text-align:center; padding:40px 20px; color:var(--muted); font-size:14px; }
.state-error { color:var(--warn); }
</style>
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div class="top-bar">
      <div class="app-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        Doomsday Watch · Chalakudy
      </div>
      <div class="tools">
        <button class="btn" id="notif" type="button">Enable alerts</button>
        <button class="btn primary" id="refresh" type="button">Check now</button>
        <button class="icon-btn" id="theme" type="button" aria-label="Toggle theme">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
    <div class="filter-bar" id="chips"></div>
  </div>
</header>

<main>
  <div class="status-bar" id="status"></div>

  <section id="upper"></section>
  <div class="divider"></div>
  <section id="lower"></section>
</main>

<script>
(() => {
  /* ── CONFIG ───────────────────────────────────────────────────────────── */
  const CHECK_MINUTES = 60;                       // 0.5 = 30 min, 0.25 = 15 min
  const PROXY = 'https://corsproxy.io/?url=';     // browser can't call district.in directly (CORS). Swap for your own proxy.
  const TARGET = /avengers.*doomsday/i;           // movie to watch
  const RELEASE = '2026-12-18';                   // release date; also probed for shows
  const PROBE_DAYS = 3;                           // probe release date + N-1 following days
  const MAX_TAB_DAYS = 6;                         // max date tabs fetched per theatre
  const THEATRES = [
    { key: 'd',  name: 'D Cinemas 4K',  hue: 265, url: 'https://www.district.in/movies/d-cinemas-4k-south-junction-chalakudy-CD1035939' },
    { key: 's',  name: 'Surabhi Movies', hue: 190, url: 'https://www.district.in/movies/surabhi-movies-70-mm-4k-rgb-laser-3d-dolby-south-junction-chalakudy-CD3976' }
  ];
  const ORIGIN = 'https://www.district.in';

  /* ── state ────────────────────────────────────────────────────────────── */
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let results = [];          // [{...theatre, days:{date:[movie]}, error}]
  let filter = 'all', lastCheck = null, nextCheck = null, busy = false;
  const open = new Set(), seatRes = new Map(), shows = new Map();
  let seatN = 2;

  const store = {
    get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} }
  };

  /* ── fetch + parse ────────────────────────────────────────────────────── */
  async function get(url) {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 20000);
    try {
      const r = await fetch(PROXY + encodeURIComponent(url), { signal: ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.text();
    } finally { clearTimeout(to); }
  }

  const TIME = /(\d{1,2}:\d{2})\s*([AP]M)/i;

  // Theatre page: movie <li> with anchor ".../<slug>-movie-tickets-in--MV<id>", nested session items
  // with anchor ".../seat-layout/<id>?encsessionid=..." (no anchor when show is not bookable).
  function parseTheatre(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const dates = [...new Set([...doc.querySelectorAll('a[href*="fromdate="]')]
      .map(a => (a.getAttribute('href').match(/fromdate=(\d{4}-\d{2}-\d{2})/) || [])[1]).filter(Boolean))];
    const movies = [], seen = new Set();
    doc.querySelectorAll('a[href*="-movie-tickets-in-"]').forEach(a => {
      const href = a.getAttribute('href') || '';
      const id = (href.match(/-MV(\d+)/) || [])[1];
      const li = a.closest('li');
      if (!id || !li || seen.has(li)) return;
      seen.add(li);
      const leaves = [...a.querySelectorAll('*')].filter(e => !e.children.length && e.textContent.trim());
      const slug = (href.split('/').pop() || '').replace(/-movie-tickets.*/, '');
      const title = (leaves[0] ? leaves[0].textContent.trim() : slug.replace(/-/g, ' '));
      const meta = leaves.slice(1).map(e => e.textContent.trim()).join(' ');
      const lang = (meta.match(/\|\s*([A-Za-z ]+?)(?:\s{2,}|[A-Z][a-z]+,|$)/) || [])[1] || '';
      const sessions = [];
      let items = [...li.querySelectorAll('li')].filter(e => TIME.test(e.textContent));
      if (!items.length) items = [...li.querySelectorAll('a[href*="seat-layout"]')];
      items.forEach(e => {
        const t = e.textContent.replace(/\s+/g, ' ').trim().match(TIME);
        if (!t) return;
        const link = e.querySelector('a[href*="seat-layout"]') || e.closest('a[href*="seat-layout"]');
        const rest = e.textContent.replace(/\s+/g, ' ').trim().split(t[0]).pop().trim();
        sessions.push({
          time: t[1] + ' ' + t[2].toUpperCase(),
          screen: rest.replace(/No tickets.*$/i, '').trim(),
          soldOut: /no tickets/i.test(e.textContent),
          url: link ? new URL(link.getAttribute('href'), ORIGIN).href : null
        });
      });
      movies.push({ id, title, slug, lang: lang.trim(), sessions });
    });
    return { dates, movies };
  }

  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const sig = ms => ms.map(m => m.id + ':' + m.sessions.map(s => s.time).join(',')).join('|');

  async function checkTheatre(t) {
    const r = { ...t, days: {}, error: null };
    try {
      const base = parseTheatre(await get(t.url));
      const baseDate = base.dates[0] || iso(new Date());
      r.days[baseDate] = base.movies;
      const probe = [];
      for (let i = 0; i < PROBE_DAYS; i++) { const d = new Date(RELEASE + 'T00:00:00'); d.setDate(d.getDate() + i); probe.push(iso(d)); }
      const extra = [...new Set([...base.dates.slice(1, MAX_TAB_DAYS), ...probe])].filter(d => d !== baseDate);
      await Promise.all(extra.map(async d => {
        try {
          const p = parseTheatre(await get(t.url + '?fromdate=' + d));
          if (p.movies.length && sig(p.movies) !== sig(base.movies)) r.days[d] = p.movies;
        } catch (_) {}
      }));
    } catch (e) { r.error = e.message || 'failed'; }
    return r;
  }

  const isTarget = m => TARGET.test(m.title + ' ' + m.slug.replace(/-/g, ' '));

  async function checkAll() {
    if (busy) return; busy = true;
    $('#refresh').textContent = 'Checking…';
    results = await Promise.all(THEATRES.map(checkTheatre));
    lastCheck = new Date();
    nextCheck = new Date(Date.now() + CHECK_MINUTES * 60000);
    busy = false;
    $('#refresh').textContent = 'Check now';
    const live = results.some(r => Object.values(r.days).some(ms => ms.some(isTarget)));
    const prev = store.get('dd_live') === '1';
    if (live && !prev) alert_();
    if (!results.every(r => r.error)) store.set('dd_live', live ? '1' : '0');
    render();
  }

  function alert_() {
    document.title = '🎬 DOOMSDAY BOOKING OPEN';
    try {
      const c = new (window.AudioContext || window.webkitAudioContext)();
      [0, .25, .5].forEach(t => { const o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .15; o.start(c.currentTime + t); o.stop(c.currentTime + t + .15); });
    } catch (_) {}
    if ('Notification' in window && Notification.permission === 'granted')
      new Notification('Avengers: Doomsday booking is open', { body: 'Shows listed at Chalakudy theatres.' });
  }

  /* ── seat parsing (best-effort: seat-layout JSON shape is not documented) ─ */
  function collectSeats(node, out) {
    if (Array.isArray(node)) {
      if (node.length && node.every(o => o && typeof o === 'object' && !Array.isArray(o))) {
        const ks = Object.keys(node[0]);
        const status = ks.find(k => /status|avail|sold|book/i.test(k));
        const row = ks.find(k => /row/i.test(k));
        const col = ks.find(k => /col|seatno|seatnum|seat_?number|number|^name$|^id$|seat/i.test(k) && k !== row && k !== status);
        if (status && (row || col) && col) { node.forEach(o => out.push({ o, status, row, col })); return; }
      }
      node.forEach(n => collectSeats(n, out));
    } else if (node && typeof node === 'object') Object.values(node).forEach(n => collectSeats(n, out));
  }
  const isFree = v => {
    if (typeof v === 'boolean') return v;
    const s = String(v).toLowerCase();
    if (/sold|book|taken|block|reserv|unavail|occup/.test(s)) return false;
    return /avail|free|empty|open|^0$|^1$|^a$|^true$/.test(s);
  };

  function buildGrid(html) {
    let data = null;
    const m = html.match(/<script id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/);
    try { data = JSON.parse(m ? m[1] : html); } catch (_) {}
    if (!data) return null;
    const found = []; collectSeats(data, found);
    if (!found.length) return null;
    const rowsMap = new Map();
    found.forEach(({ o, status, row, col }, i) => {
      const r = row ? String(o[row]) : String(o.areaCode || o.area || '') + (o.rowId || '');
      const cn = parseInt(String(o[col]).replace(/\D/g, ''), 10);
      if (isNaN(cn)) return;
      if (!rowsMap.has(r)) rowsMap.set(r, []);
      rowsMap.get(r).push({ c: cn, free: isFree(o[status]), label: r + cn });
    });
    const rows = [...rowsMap.entries()].map(([r, seats]) => ({ r, seats: seats.sort((a, b) => a.c - b.c) }));
    return rows.length ? rows : null;
  }

  // front row = first row in data. Score: centre columns, ~60% back from screen.
  function bestSeats(rows, n) {
    const H = Math.max(rows.length - 1, 1);
    const wins = [];
    rows.forEach((row, ri) => {
      const cmin = row.seats[0].c, cmax = row.seats[row.seats.length - 1].c, span = Math.max(cmax - cmin, 1);
      for (let i = 0; i + n <= row.seats.length; i++) {
        const w = row.seats.slice(i, i + n);
        if (!w.every((s, k) => s.free && (k === 0 || s.c - w[k - 1].c === 1))) continue;
        const mid = (w[0].c + w[n - 1].c) / 2;
        const score = 100 - 120 * Math.pow(ri / H - .6, 2) - 80 * Math.pow((mid - cmin) / span - .5, 2);
        wins.push({ score, seats: w.map(s => s.label) });
      }
    });
    return wins.sort((a, b) => b.score - a.score).slice(0, 3);
  }

  function seatHTML(rows, best) {
    const pick = new Set(best[0] ? best[0].seats : []);
    const cmax = Math.max(...rows.flatMap(r => r.seats.map(s => s.c)));
    return '<div class="seatmap">' + rows.map(r => {
      let h = '', pos = 1;
      r.seats.forEach(s => { for (; pos < s.c; pos++) h += '<i></i>'; h += `<span class="seat ${pick.has(s.label) ? 'b' : s.free ? '' : 'x'}" title="${esc(s.label)}"></span>`; pos = s.c + 1; });
      return '<div class="srow">' + h + '</div>';
    }).join('') + '</div>';
  }

  async function loadSeats(id) {
    const s = shows.get(id); if (!s) return;
    seatRes.set(id, { loading: true }); render();
    try {
      const rows = buildGrid(await get(s.url));
      seatRes.set(id, rows ? { rows } : { err: 'Seat data not readable' });
    } catch (e) { seatRes.set(id, { err: e.message || 'failed' }); }
    render();
  }

  /* ── rendering ────────────────────────────────────────────────────────── */
  const dayLabel = d => new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });

  function showHTML(t, d, m, s, i) {
    const id = `${t.key}|${d}|${m.id}|${i}`;
    if (s.url) shows.set(id, s);
    const r = seatRes.get(id);
    let res = '';
    if (r) {
      if (r.loading) res = '<div class="res">Loading seats…</div>';
      else if (r.err) res = `<div class="res">${esc(r.err)}</div>`;
      else {
        const best = bestSeats(r.rows, seatN);
        const free = r.rows.reduce((a, x) => a + x.seats.filter(z => z.free).length, 0);
        const all = r.rows.reduce((a, x) => a + x.seats.length, 0);
        res = `<div class="res">${free}/${all} free · ` + (best.length
          ? `best ${seatN}: <b>${best[0].seats.join(', ')}</b>` + (best[1] ? ` · alt ${best[1].seats.join(', ')}` : '')
          : `no ${seatN} adjacent seats`) + '</div>' + seatHTML(r.rows, best);
      }
    }
    return `<div class="show">
      <div class="show-top"><span class="show-time">${esc(s.time)}</span><span class="show-screen">${esc(s.screen)}</span></div>
      <div class="show-actions">
        ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">Book</a><button class="link-btn" data-seat="${esc(id)}" type="button">Best seats</button>`
                : `<span class="res">${s.soldOut ? 'Sold out' : 'Not bookable'}</span>`}
      </div>${res}</div>`;
  }

  function daysHTML(t, m, days) {
    return Object.keys(days).sort().map(d =>
      `<div class="field-row"><span class="field-key">${dayLabel(d)}</span><div class="field-val">${days[d].map((s, i) => showHTML(t, d, m, s, i)).join('')}</div></div>`
    ).join('');
  }

  function upper() {
    const vis = results.filter(r => filter === 'all' || r.key === filter);
    const hits = [];
    vis.forEach(t => {
      const days = {}; let movie = null;
      Object.entries(t.days).forEach(([d, ms]) => ms.filter(isTarget).forEach(m => { days[d] = m.sessions; movie = m; }));
      if (movie) hits.push({ t, movie, days });
    });
    const allFail = results.length && results.every(r => r.error);
    const daysLeft = Math.ceil((new Date(RELEASE + 'T00:00:00') - new Date()) / 86400000);
    const live = hits.length > 0;
    const badge = !results.length ? '<span class="badge">Checking…</span>'
      : allFail ? '<span class="badge err">Check failed</span>'
      : live ? '<span class="badge ok">Booking open</span>' : '<span class="badge">Not open yet</span>';
    let rows = '';
    if (live) {
      rows = hits.map(({ t, movie, days }) => `<article class="card open" style="--ch:${t.hue}">
        <div class="card-head" style="cursor:default"><span class="card-stripe"></span><span class="card-head-inner"><span class="card-text">
        <span class="card-category">${esc(t.name)}</span><span class="card-name">${esc(movie.title)}</span></span></span></div>
        <div class="card-body"><div class="card-body-inner">${daysHTML(t, movie, days)}</div></div></article>`).join('');
    } else if (results.length) {
      rows = results.filter(r => filter === 'all' || r.key === filter).map(r =>
        `<div class="field-row" style="--ch:${r.hue}"><span class="field-key">${esc(r.name)}</span><div class="field-val">${r.error ? 'Fetch error: ' + esc(r.error) : 'Not listed'}</div></div>`).join('');
    }
    $('#upper').innerHTML = `<div class="sec-title">Avengers: Doomsday</div>
      <div class="hero${live ? ' live' : ''}">
        <div class="hero-top"><div><h2>Avengers: Doomsday</h2>
        <div class="sub">Releases ${dayLabel(RELEASE)}${daysLeft > 0 ? ` · ${daysLeft} day${daysLeft === 1 ? '' : 's'} to go` : ''}</div></div>${badge}</div>
        ${live ? '' : `<div class="hero-rows">${rows}</div>`}
      </div>${live ? rows : ''}`;
  }

  function lower() {
    const vis = results.filter(r => filter === 'all' || r.key === filter);
    if (!results.length) { $('#lower').innerHTML = '<div class="state-empty">Loading shows…</div>'; return; }
    let html = '<div class="sec-title">Now showing</div>';
    vis.forEach(t => {
      const byMovie = new Map();
      Object.entries(t.days).forEach(([d, ms]) => ms.forEach(m => {
        if (!byMovie.has(m.id)) byMovie.set(m.id, { m, days: {} });
        byMovie.get(m.id).days[d] = m.sessions;
      }));
      html += `<div class="group-header" style="--ch:${t.hue}"><span class="cdot"></span><span class="group-title">${esc(t.name)}</span><span class="group-count">${byMovie.size}</span></div>`;
      if (t.error) html += `<div class="state-error">Fetch error: ${esc(t.error)}</div>`;
      else if (!byMovie.size) html += '<div class="note">No shows found. Page layout may have changed.</div>';
      [...byMovie.values()].forEach(({ m, days }, i) => {
        const cid = t.key + m.id, total = Object.values(days).reduce((a, s) => a + s.length, 0);
        const o = open.has(cid);
        html += `<article class="card${o ? ' open' : ''}" style="--ch:${t.hue};animation-delay:${Math.min(i, 12) * 16}ms" data-cid="${cid}">
          <button class="card-head" type="button" aria-expanded="${o}"><span class="card-stripe"></span><span class="card-head-inner">
            <span class="card-text"><span class="card-name">${esc(m.title)}</span>
            <span class="card-summary">${m.lang ? esc(m.lang) + ' · ' : ''}${total} show${total === 1 ? '' : 's'}</span></span>
            <span class="chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
          </span></button>
          <div class="card-body"><div class="card-body-inner">${daysHTML(t, m, days)}</div></div></article>`;
      });
    });
    $('#lower').innerHTML = html;
  }

  function chips() {
    $('#chips').innerHTML = `<button class="chip" data-f="all" aria-pressed="${filter === 'all'}" type="button">All</button>` +
      THEATRES.map(t => `<button class="chip" data-f="${t.key}" aria-pressed="${filter === t.key}" style="--ch:${t.hue}" type="button"><span class="cdot"></span>${esc(t.name)}</button>`).join('') +
      `<label class="chip" style="margin-left:auto">Seats for <select id="seatn" style="padding:0 2px">${[1,2,3,4,5,6].map(n => `<option${n === seatN ? ' selected' : ''}>${n}</option>`).join('')}</select></label>`;
  }

  function status() {
    const f = d => d ? d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '—';
    $('#status').innerHTML = `<span>Last check ${f(lastCheck)}</span><span>Next ${f(nextCheck)}</span><span>Every ${CHECK_MINUTES * 60} min</span>`;
  }

  function render() { chips(); status(); upper(); lower(); }

  /* ── events ───────────────────────────────────────────────────────────── */
  $('#theme').addEventListener('click', () => {
    const el = document.documentElement, cur = el.getAttribute('data-theme');
    const dark = cur === 'dark' || (!cur && matchMedia('(prefers-color-scheme: dark)').matches);
    el.setAttribute('data-theme', dark ? 'light' : 'dark'); store.set('theme', dark ? 'light' : 'dark');
  });
  $('#refresh').addEventListener('click', checkAll);
  $('#notif').addEventListener('click', async () => {
    if (!('Notification' in window)) return;
    const p = await Notification.requestPermission();
    $('#notif').textContent = p === 'granted' ? 'Alerts on' : 'Alerts blocked';
  });
  if ('Notification' in window && Notification.permission === 'granted') $('#notif').textContent = 'Alerts on';
  $('#chips').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; render(); } });
  $('#chips').addEventListener('change', e => { if (e.target.id === 'seatn') { seatN = +e.target.value; render(); } });
  document.addEventListener('click', e => {
    const sb = e.target.closest('[data-seat]');
    if (sb) { loadSeats(sb.dataset.seat); return; }
    const head = e.target.closest('#lower .card-head');
    if (head) { const c = head.closest('.card'), id = c.dataset.cid; open.has(id) ? open.delete(id) : open.add(id); c.classList.toggle('open', open.has(id)); head.setAttribute('aria-expanded', open.has(id)); }
  });
  window.addEventListener('focus', () => { if (document.title.startsWith('🎬')) document.title = 'Doomsday Watch · Chalakudy'; });

  render();
  checkAll();
  setInterval(checkAll, CHECK_MINUTES * 60000);
  setInterval(status, 30000);
})();
</script>
</body>
</html>
